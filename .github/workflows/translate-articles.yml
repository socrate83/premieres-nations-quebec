# Traduction EN + ES — automatique sur les serveurs GitHub (ne bloque pas votre PC).
# Jusqu'à 20 articles par exécution (tout le reliquat en une fois si ≤20).
# Après commit, le déploiement Pages met le site à jour.
name: Traduire les articles (nocturne)

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Nombre d'articles pour cette exécution (défaut 20 = tout le reliquat en une fois)"
        required: false
        default: '20'
  schedule:
    # Chaque jour ~03:00 (Québec, été) — jusqu'à 20 non traduits, plus petit numéro d'abord.
    - cron: '0 7 * * *'

permissions:
  contents: write

concurrency:
  group: translate-articles
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prochain numéro à traduire (#15, #16…)
        id: batch
        run: |
          COUNT="${{ github.event.inputs.count || '20' }}"
          SLUGS="$(node scripts/next-untranslated.mjs "$COUNT")"
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          if [ -z "$SLUGS" ]; then
            echo "Tous les articles numérotés sont traduits."
          else
            echo "Traduction (ordre numérique) : $SLUGS"
          fi

      - name: Traduire EN + ES
        if: steps.batch.outputs.slugs != ''
        run: node scripts/build-article-translations.mjs --only "${{ steps.batch.outputs.slugs }}" --skip-existing

      - name: Mettre à jour cartes / vidéos / podcasts (EN + ES)
        if: steps.batch.outputs.slugs != ''
        run: |
          node scripts/build-blog-cards-i18n.mjs
          node scripts/build-videos-i18n.mjs
          node scripts/build-podcasts-i18n.mjs

      - name: Publier sur main (déclenche GitHub Pages)
        if: steps.batch.outputs.slugs != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add locales/articles/*.json locales/blog-serie-i18n.json locales/videos-i18n.json locales/podcasts-i18n.json
          if git diff --cached --quiet; then
            echo "Aucun changement à commiter."
          else
            git commit -m "Traduction auto : ${{ steps.batch.outputs.slugs }}"
            git push
          fi
