# Publication automatique des parties #79+ (file episodes-queue/)
# Vérifie chaque jour si une partie est due ; copie HTML + images sur le site.
name: Publier épisodes (#79+)

on:
  workflow_dispatch:
  schedule:
    # ~03 h 30 Québec (été) — 30 min après traductions nocturnes (évite conflit git push)
    - cron: '30 7 * * *'

permissions:
  contents: write

concurrency:
  group: publish-episodes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publier partie(s) due(s) + traduction EN/ES
        run: node scripts/publish-next-episode.mjs
