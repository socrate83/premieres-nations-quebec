<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Publier — Premières Nations</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #f0e6d3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      color: #f5c77e;
      text-align: center;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #b0a090;
      margin-bottom: 30px;
      text-align: center;
    }

    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #b0a090;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      background: #0f3460;
      border: 1px solid #2a4a7f;
      border-radius: 10px;
      color: #f0e6d3;
      font-size: 0.95rem;
      padding: 14px;
      resize: vertical;
      line-height: 1.6;
      outline: none;
      transition: border 0.2s;
    }

    textarea:focus { border-color: #f5c77e; }

    .url-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      align-items: center;
    }

    .url-row input {
      flex: 1;
      background: #0f3460;
      border: 1px solid #2a4a7f;
      border-radius: 8px;
      color: #f0e6d3;
      font-size: 0.9rem;
      padding: 10px 14px;
      outline: none;
    }

    .url-row input:focus { border-color: #f5c77e; }

    .char-count {
      text-align: right;
      font-size: 0.8rem;
      color: #7a8a9a;
      margin-top: 6px;
    }

    .char-count.warn { color: #e67e22; }
    .char-count.over { color: #e74c3c; }

    .networks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-network {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 10px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: transform 0.15s, opacity 0.2s;
      text-decoration: none;
      color: white;
    }

    .btn-network:hover { transform: translateY(-2px); opacity: 0.92; }
    .btn-network:active { transform: scale(0.97); }

    .btn-facebook  { background: #1877f2; }
    .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .btn-whatsapp  { background: #25d366; }
    .btn-twitter   { background: #000000; }
    .btn-telegram  { background: #0088cc; }
    .btn-copy      { background: #555; grid-column: 1 / -1; }

    .btn-network svg { width: 22px; height: 22px; fill: white; flex-shrink: 0; }

    .divider {
      border: none;
      border-top: 1px solid #2a4a7f;
      margin: 24px 0;
    }

    .history-title {
      font-size: 0.85rem;
      color: #b0a090;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .history-list { list-style: none; }

    .history-item {
      background: #0f3460;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: #c0b09a;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:hover { background: #1a4070; }
    .history-item .date { font-size: 0.75rem; color: #7a8a9a; }
    .history-item .preview { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #27ae60;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.3s;
      z-index: 9999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .reset-btn {
      background: none;
      border: 1px solid #2a4a7f;
      color: #b0a090;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 12px;
      transition: background 0.2s;
    }
    .reset-btn:hover { background: #0f3460; }
  </style>

<article class="article-ecoute">

<div class="card">

  <textarea id="msg" placeholder="Écris ou colle ton texte ici...">🌿 Nouveau site en ligne — Les Premières Nations du Québec 🌿

    <input type="text" id="urlInput" placeholder="URL à partager (optionnel)" value="https://socrate83.github.io/premieres-nations-quebec/Home.html" />

  <div class="history-title">📋 Historique des publications</div>
  <ul class="history-list" id="historyList"></ul>
  <button class="reset-btn" onclick="clearHistory()">🗑️ Effacer l'historique</button>

</div>

<div class="toast" id="toast">✅ Copié !</div>

<script>
  const textarea = document.getElementById('msg');
  const charCount = document.getElementById('charCount');

  function updateCount() {
    const len = textarea.value.length;
    charCount.textContent = len + ' caractères';
    charCount.className = 'char-count' + (len > 280 ? ' warn' : '');
  }

  textarea.addEventListener('input', updateCount);
  updateCount();

  function shareNetwork(network) {
    const text = encodeURIComponent(textarea.value);
    const url = encodeURIComponent(document.getElementById('urlInput').value);
    let shareUrl = '';

    switch(network) {
      case 'facebook':
        shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${text}`;
        break;
      case 'instagram':
        copyRaw();
        showToast('📋 Texte copié — ouvre Instagram et colle-le !');
        return;
      case 'whatsapp':
        shareUrl = `https://wa.me/?text=${text}`;
        break;
      case 'twitter':
        shareUrl = `https://twitter.com/intent/tweet?text=${text}`;
        break;
      case 'telegram':
        shareUrl = `https://t.me/share/url?url=${url}&text=${text}`;
        break;
    }

    if (shareUrl) {
      saveHistory(network);
      window.open(shareUrl, '_blank', 'width=600,height=500');
    }
  }

  function copyRaw() {
    const text = textarea.value;
    navigator.clipboard.writeText(text);
  }

  function copyText() {
    copyRaw();
    showToast('✅ Texte copié !');
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function saveHistory(network) {
    const history = JSON.parse(localStorage.getItem('postHistory') || '[]');
    const preview = textarea.value.substring(0, 60) + '...';
    const date = new Date().toLocaleDateString('fr-CA');
    history.unshift({ network, preview, date });
    if (history.length > 10) history.pop();
    localStorage.setItem('postHistory', JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    const history = JSON.parse(localStorage.getItem('postHistory') || '[]');
    const list = document.getElementById('historyList');
    list.innerHTML = '';
    if (history.length === 0) {
      list.innerHTML = '<li style="color:#7a8a9a;font-size:0.85rem;padding:8px 0;">Aucune publication pour l\'instant.</li>';
      return;
    }
    const icons = { facebook:'🔵', instagram:'📸', whatsapp:'💬', twitter:'🐦', telegram:'✈️' };
    history.forEach(item => {
      const li = document.createElement('li');
      li.className = 'history-item';
      li.innerHTML = `<span class="preview">${icons[item.network] || '📢'} ${item.preview}</span><span class="date">${item.date}</span>`;
      li.onclick = () => { textarea.value = item.preview.replace('...',''); updateCount(); };
      list.appendChild(li);
    });
  }

  function clearHistory() {
    localStorage.removeItem('postHistory');
    renderHistory();
  }

  renderHistory();
</script>

</article>
